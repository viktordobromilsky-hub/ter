<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Для Кати</title>
<style>
:root{
  --ink:#120808; --oxblood:#5b1b21; --umber:#3a2316; --amber:#e0953a; --paper:#ecdcb8; --paper-dim:#b9a784;
  --serif:"Cormorant Garamond","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
  --hand:"Segoe Script","Bradley Hand","Snell Roundhand","Lucida Handwriting","Comic Sans MS",cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--paper);font-family:var(--serif);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

/* ---------- атмосфера ---------- */
#bg{position:fixed;inset:0;z-index:0;background:
  radial-gradient(ellipse 60% 50% at 50% 38%,rgba(224,149,58,.16),transparent 70%),
  radial-gradient(ellipse 120% 90% at 50% 120%,var(--oxblood),transparent 60%),
  var(--ink);animation:breathe 9s ease-in-out infinite alternate}
@keyframes breathe{from{filter:brightness(.88)}to{filter:brightness(1.08)}}
#dust{position:fixed;inset:0;z-index:1;pointer-events:none;width:100%;height:100%}
#grain{position:fixed;inset:-50%;z-index:9;pointer-events:none;opacity:.14;mix-blend-mode:overlay;animation:grain 1.2s steps(6) infinite;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-4%,3%)}40%{transform:translate(3%,-5%)}60%{transform:translate(-5%,-2%)}80%{transform:translate(4%,4%)}100%{transform:translate(0,0)}}
#vignette{position:fixed;inset:0;z-index:8;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.72) 100%)}

/* ---------- слайды ---------- */
#stage{position:fixed;inset:0;z-index:5}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:clamp(20px,5vh,56px) clamp(20px,6vw,64px) 96px;text-align:center;overflow-y:auto;
  opacity:0;visibility:hidden;filter:blur(10px);transform:scale(1.04);
  transition:opacity 1.1s ease,filter 1.1s ease,transform 1.6s cubic-bezier(.2,.7,.2,1),visibility 0s 1.1s}
.slide.on{opacity:1;visibility:visible;filter:none;transform:none;transition-delay:0s}
.slide>*{max-width:100%}
.fade{opacity:0;transform:translateY(14px);transition:opacity 1.4s ease,transform 1.4s ease}
.slide.on .fade{opacity:1;transform:none}
.slide.on .d1{transition-delay:.5s}.slide.on .d2{transition-delay:1.1s}.slide.on .d3{transition-delay:1.9s}.slide.on .d4{transition-delay:2.8s}

h1,h2{font-weight:500;font-style:italic;letter-spacing:.01em;line-height:1.05}
.small{font-size:clamp(15px,2.2vw,19px);color:var(--paper-dim);letter-spacing:.04em;font-style:italic}
.hand{font-family:var(--hand);color:var(--amber);font-size:clamp(20px,3.4vw,28px)}

/* 1 — запечатанное письмо */
.seal{position:relative;margin-top:34px;width:112px;height:112px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#a02c33,var(--oxblood) 55%,#2e0b0f);
  box-shadow:0 0 0 3px rgba(0,0,0,.35) inset,0 14px 40px rgba(0,0,0,.65),0 0 60px rgba(160,44,51,.28);
  display:grid;place-items:center;transition:transform .5s,box-shadow .5s;animation:pulse 4.5s ease-in-out infinite}
.seal::before{content:"";position:absolute;inset:11px;border-radius:50%;border:1px solid rgba(236,220,184,.35)}
.seal span{font-family:var(--hand);font-size:44px;color:rgba(236,220,184,.88);text-shadow:0 1px 0 rgba(0,0,0,.5)}
.seal:hover{transform:scale(1.06) rotate(-3deg);box-shadow:0 0 0 3px rgba(0,0,0,.35) inset,0 18px 50px rgba(0,0,0,.7),0 0 90px rgba(224,149,58,.35)}
.seal:active{transform:scale(.94)}
@keyframes pulse{50%{box-shadow:0 0 0 3px rgba(0,0,0,.35) inset,0 14px 40px rgba(0,0,0,.65),0 0 90px rgba(160,44,51,.5)}}
#s1 h1{font-size:clamp(40px,9vw,92px);margin:14px 0 6px}
.hint{margin-top:18px}

/* 2 — поздравление */
.frame{position:relative;padding:clamp(28px,5vw,54px) clamp(22px,5vw,60px);max-width:640px;border:1px solid rgba(236,220,184,.28)}
.frame::before{content:"";position:absolute;inset:7px;border:1px solid rgba(236,220,184,.14);pointer-events:none}
#s2 h2{font-size:clamp(46px,11vw,112px);margin:6px 0 16px;text-shadow:0 0 40px rgba(224,149,58,.3)}
#s2 .body{font-size:clamp(18px,2.7vw,23px);line-height:1.65;color:#e4d3ae}
#s2 .body p+p{margin-top:.8em}

/* 3 — сцена с видео */
.arch{position:relative;width:min(78vw,340px);aspect-ratio:592/576;border-radius:999px 999px 6px 6px;overflow:hidden;
  box-shadow:0 0 0 1px rgba(236,220,184,.35),0 0 0 9px var(--ink),0 0 0 10px rgba(236,220,184,.2),0 30px 80px rgba(0,0,0,.8),0 0 120px rgba(224,149,58,.18);background:#000}
.arch video{width:100%;height:100%;object-fit:cover;display:block;filter:sepia(.28) contrast(1.06) saturate(.92)}
.arch::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,transparent 50%,rgba(18,8,8,.55));pointer-events:none}
#cap{margin-top:34px;min-height:3.2em;font-size:clamp(20px,3.4vw,28px);font-style:italic;max-width:520px;line-height:1.35;transition:opacity 1s}
#cap.out{opacity:0}
#s3 .small{margin-top:10px}

/* 4 — письмо */
.letter{position:relative;width:min(100%,600px);max-height:100%;overflow-y:auto;text-align:left;color:#2b1a10;padding:clamp(26px,5vw,48px) clamp(24px,5vw,52px);
  background:
   repeating-linear-gradient(transparent 0 33px,rgba(91,27,33,.12) 33px 34px),
   radial-gradient(ellipse at 20% 0%,#f2e4c3,#dcc79b 70%,#c4ab7a);
  box-shadow:0 30px 80px rgba(0,0,0,.75),inset 0 0 70px rgba(110,70,30,.35);transform:rotate(-.6deg);
  clip-path:polygon(0 1%,3% 0,97% 1%,100% 0,99% 99%,96% 100%,3% 99%,0 100%)}
.letter .to{font-family:var(--hand);font-size:clamp(22px,4vw,30px);color:var(--oxblood);margin-bottom:12px;line-height:34px}
.letter p{font-family:var(--hand);font-size:clamp(16px,2.6vw,19px);line-height:34px;opacity:0;transition:opacity 1.6s ease}
.letter p.show{opacity:1}
.letter .sign{margin-top:10px;text-align:right;color:var(--oxblood)}

/* 5 — финал */
.flame{width:14px;height:26px;margin:0 auto 22px;border-radius:50% 50% 50% 50%/65% 65% 35% 35%;
  background:radial-gradient(ellipse at 50% 75%,#fff4cf,var(--amber) 55%,transparent 75%);
  box-shadow:0 0 26px 10px rgba(224,149,58,.5),0 0 120px 50px rgba(224,149,58,.18);animation:flick 3s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1,1) skewX(0)}30%{transform:scale(.92,1.08) skewX(2deg)}60%{transform:scale(1.05,.95) skewX(-2deg);opacity:.9}}
#s5 h2{font-size:clamp(34px,7.5vw,76px);max-width:14em;margin-bottom:18px}
#s5 .fin{animation:none}
.again{margin-top:34px;padding:10px 26px;border:1px solid rgba(236,220,184,.4);font-style:italic;font-size:18px;letter-spacing:.04em;transition:.4s}
.again:hover{background:rgba(236,220,184,.1);border-color:var(--amber);color:#fff}

/* ---------- интерфейс ---------- */
#nav{position:fixed;z-index:20;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;gap:18px;padding:16px 16px calc(16px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent,rgba(18,8,8,.85));transition:opacity .8s}
#nav.hidden,#music.hidden{opacity:0;pointer-events:none}
.arrow{width:46px;height:46px;border-radius:50%;border:1px solid rgba(236,220,184,.38);font-size:22px;line-height:1;display:grid;place-items:center;transition:.35s}
.arrow:hover:not(:disabled){border-color:var(--amber);background:rgba(224,149,58,.12);transform:scale(1.07)}
.arrow:active:not(:disabled){transform:scale(.93)}
.arrow:disabled{opacity:.25;cursor:default}
#dots{display:flex;gap:10px}
#dots button{width:8px;height:8px;border-radius:50%;background:rgba(236,220,184,.3);transition:.5s;padding:0}
#dots button.on{background:var(--amber);box-shadow:0 0 12px var(--amber);transform:scale(1.35)}

#music{position:fixed;z-index:20;top:max(14px,env(safe-area-inset-top));right:14px;display:flex;align-items:center;gap:12px;padding:8px 14px 8px 8px;
  border:1px solid rgba(236,220,184,.25);border-radius:999px;background:rgba(18,8,8,.6);backdrop-filter:blur(8px);transition:opacity .8s}
#play{width:34px;height:34px;border-radius:50%;background:var(--oxblood);display:grid;place-items:center;transition:.3s}
#play:hover{background:#7d252d;transform:scale(1.08)}
#play svg{width:14px;height:14px;fill:var(--paper)}
#play .ic-pause{display:none}.playing #play .ic-pause{display:block}.playing #play .ic-play{display:none}
.eq{display:flex;align-items:flex-end;gap:2px;height:16px}
.eq i{width:2px;height:4px;background:var(--amber);border-radius:1px}
.playing .eq i{animation:eq 1s ease-in-out infinite alternate}
.playing .eq i:nth-child(2){animation-delay:-.3s}.playing .eq i:nth-child(3){animation-delay:-.6s}.playing .eq i:nth-child(4){animation-delay:-.15s}
@keyframes eq{from{height:3px}to{height:16px}}
#vol{width:70px;accent-color:var(--amber);height:3px;cursor:pointer}
#track{font-size:14px;font-style:italic;color:var(--paper-dim);white-space:nowrap}
#err{position:fixed;z-index:30;top:70px;right:14px;max-width:min(300px,calc(100vw - 28px));padding:10px 14px;background:#3a0f14;border:1px solid #a02c33;font-size:15px;display:none}
@media(max-width:560px){#track{display:none}#vol{width:56px}}
@media(max-height:560px){.slide{justify-content:flex-start}}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01s!important;transition-delay:0s!important}
  #grain{display:none}.letter p{opacity:1}
}
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="dust" aria-hidden="true"></canvas>

<main id="stage">
  <!-- 1 -->
  <section class="slide on" id="s1">
    <p class="small fade d1" data-t="introTop"></p>
    <h1 class="fade d2" data-t="introTitle"></h1>
    <p class="small fade d3" data-t="introSub"></p>
    <button class="seal fade d4" id="open" aria-label="Открыть открытку"><span>K</span></button>
    <p class="small hint fade d4" data-t="introButton"></p>
  </section>

  <!-- 2 -->
  <section class="slide" id="s2">
    <div class="frame">
      <p class="small fade d1" data-t="greetTop"></p>
      <h2 class="fade d2" data-t="greetTitle"></h2>
      <div class="body fade d3" id="greetBody"></div>
    </div>
  </section>

  <!-- 3 -->
  <section class="slide" id="s3">
    <div class="arch fade d1"><video id="vid" src="assets/video-1.mp4" muted loop playsinline preload="auto"></video></div>
    <p id="cap" class="fade d2"></p>
    <p class="small fade d3" data-t="sceneSmall"></p>
  </section>

  <!-- 4 -->
  <section class="slide" id="s4">
    <article class="letter fade d1" id="letter">
      <p class="to" data-t="letterTo"></p>
      <div id="letterBody"></div>
      <p class="sign" data-t="letterSign"></p>
    </article>
  </section>

  <!-- 5 -->
  <section class="slide" id="s5">
    <div class="flame fade d1"></div>
    <h2 class="fade d2" data-t="finalLine"></h2>
    <p class="hand fade d3" data-t="finalSign"></p>
    <button class="again fade d4" id="again" data-t="finalButton"></button>
  </section>
</main>

<div id="vignette"></div>
<div id="grain"></div>

<div id="music" class="hidden">
  <button id="play" aria-label="Играть или пауза">
    <svg class="ic-play" viewBox="0 0 14 14"><path d="M3 1.5v11l9-5.5z"/></svg>
    <svg class="ic-pause" viewBox="0 0 14 14"><path d="M2.5 1.5h3.2v11H2.5zM8.3 1.5h3.2v11H8.3z"/></svg>
  </button>
  <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <span id="track">Хаски — Ветром, снегом, зноем</span>
  <input id="vol" type="range" min="0" max="1" step="0.01" value="0.6" aria-label="Громкость">
</div>
<div id="err" role="alert">Музыка не загрузилась. Проверь, что файл assets/music.mp3 лежит рядом с index.html.</div>

<nav id="nav" class="hidden" aria-label="Навигация">
  <button class="arrow" id="prev" aria-label="Назад">←</button>
  <div id="dots"></div>
  <button class="arrow" id="next" aria-label="Вперёд">→</button>
</nav>

<audio id="audio" src="assets/music.mp3" loop preload="auto"></audio>

<script>
/* =====================================================
   ТЕКСТЫ ОТКРЫТКИ — меняй здесь, остальной код трогать не нужно
   ===================================================== */
const TEXT = {
  name: "Катя",

  // Слайд 1
  introTop:    "for the most beautiful princess",
  introTitle:  "Катюше",
  introSub:    "для моего Ветерочка",
  introButton: "Нажми чтобы сломай печать",

  // Слайд 2
  greetTop:   "С днём рождения",
  greetTitle: "Катёна",
  greetBody: [
    "Есть люди, рядом с которыми осень кажется не грустной, а тёплой. Ты — одна из них.",
    "Я хочу, чтобы в этот день у тебя было всё, что ты любишь: вкусный кофи, булочка с изюмом, тёплое пальто и твой самый прекрасный свет в душе.",
    "Спасибо, что ты есть. Это правда самое прекрасное что есть в жизни."
  ],

  // Слайд 3: подписи сменяют друг друга под видео
  captions: [
    "красота вишнёвого сада",
    "бордовый листочек клёна",
    "листья под ногами и кофи в руках",
    "рыжий кот, который всё про нас знает",
    "качели на берегу с видом на природу", 
    "твой смех с самой красивой улыбкой на свете",
    "красивая выставка",
    "самая вкусная щёчка на свете"
  ],
  sceneSmall: "кадры, в которых я вижу тебя",

  // Слайд 4: каждая строка — отдельный абзац
  letterTo: "Моя Катя,",
  letterBody: [
    "Я долго думал над тем, какие правильные слова подобрать, чтобы правильно передать чувства, которые ты вызываешь одним лишь присутствием рядом со мной.",
    "Но оказалось, что самым важным чувством является то, что ты даёшь мне один из тех ключиков желания жить.",
    "Самый важный — желание жить ради любимого человека.",
    "Ты единственная, кто делает меня счастливым одним лишь присутствием рядом. Я тебя люблю."
  ],
  letterSign: "твой, навсегда",

  // Слайд 5
  finalLine:   "Любовь — это не когда всё получается, а когда любимый человек с тобой, какая бы ситуация у тебя ни происходила.",
  finalSign:   "ты самая прекрасная",
  finalButton: "прочитать сначала"
};

/* ===================== код ===================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

// тексты
$$("[data-t]").forEach(el => el.textContent = TEXT[el.dataset.t]);
$("#greetBody").innerHTML = TEXT.greetBody.map(t => `<p></p>`).join("");
$$("#greetBody p").forEach((p, i) => p.textContent = TEXT.greetBody[i]);
$("#letterBody").innerHTML = TEXT.letterBody.map(() => `<p></p>`).join("");
$$("#letterBody p").forEach((p, i) => p.textContent = TEXT.letterBody[i]);
document.title = "Для " + TEXT.name;

// слайды
const slides = $$(".slide"), dotsBox = $("#dots");
let cur = 0, started = false;
slides.forEach((_, i) => {
  const b = document.createElement("button");
  b.setAttribute("aria-label", "Слайд " + (i + 1));
  b.onclick = () => go(i);
  dotsBox.appendChild(b);
});
const dots = $$("button", dotsBox);

function go(n) {
  if (n < 0 || n >= slides.length || n === cur) return;
  if (!started && n > 0) return;
  slides[cur].classList.remove("on");
  cur = n;
  slides[cur].classList.add("on");
  dots.forEach((d, i) => d.classList.toggle("on", i === cur));
  $("#prev").disabled = cur === 0;
  $("#next").disabled = cur === slides.length - 1;
  slides[cur].scrollTop = 0;
  sceneHooks();
}
const next = () => go(cur + 1), prev = () => go(cur - 1);
$("#next").onclick = next; $("#prev").onclick = prev;
addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === "PageDown") next();
  if (e.key === "ArrowLeft" || e.key === "PageUp") prev();
});
let tx = null;
addEventListener("touchstart", e => tx = e.touches[0].clientX, { passive: true });
addEventListener("touchend", e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) > 60) dx < 0 ? next() : prev();
});

// звук
const audio = $("#audio"), music = $("#music"), vol = $("#vol");
audio.volume = +vol.value;
vol.oninput = () => audio.volume = +vol.value;
function setPlaying(p) { music.classList.toggle("playing", p); }
audio.onplay = () => setPlaying(true);
audio.onpause = () => setPlaying(false);
audio.onerror = () => $("#err").style.display = "block";
$("#play").onclick = () => audio.paused ? audio.play().catch(() => $("#err").style.display = "block") : audio.pause();

// вход
$("#open").onclick = () => {
  started = true;
  audio.play().catch(() => $("#err").style.display = "block");
  $("#nav").classList.remove("hidden");
  music.classList.remove("hidden");
  go(1);
};
$("#again").onclick = () => go(1);

// сцены: видео, подписи, письмо
const vid = $("#vid"), cap = $("#cap");
let capTimer = null, ci = 0, letterTimers = [];
function showCap() {
  cap.classList.add("out");
  setTimeout(() => {
    cap.textContent = TEXT.captions[ci % TEXT.captions.length]; ci++;
    cap.classList.remove("out");
  }, reduce ? 0 : 900);
}
function sceneHooks() {
  clearInterval(capTimer); letterTimers.forEach(clearTimeout); letterTimers = [];
  if (cur === 2) {
    vid.currentTime = 0; vid.play().catch(() => {});
    ci = 0; cap.classList.add("out"); setTimeout(showCap, 1800);
    capTimer = setInterval(showCap, 3700);
  } else vid.pause();
  const ps = $$("#letterBody p");
  if (cur === 3) {
    ps.forEach((p, i) => letterTimers.push(setTimeout(() => p.classList.add("show"), reduce ? 0 : 1500 + i * 2600)));
  } else ps.forEach(p => p.classList.remove("show"));
}
vid.onerror = () => $(".arch").style.display = "none";

// пыль и падающие листья (canvas, без библиотек)
const cv = $("#dust"), cx = cv.getContext("2d");
let W, H, parts = [];
function resize() {
  const r = devicePixelRatio || 1; W = innerWidth; H = innerHeight;
  cv.width = W * r; cv.height = H * r; cx.setTransform(r, 0, 0, r, 0, 0);
}
addEventListener("resize", resize); resize();
const mk = leaf => ({ x: Math.random() * W, y: Math.random() * H, leaf,
  r: leaf ? 4 + Math.random() * 4 : .4 + Math.random() * 1.3,
  vy: leaf ? .25 + Math.random() * .4 : -.04 - Math.random() * .12, vx: (Math.random() - .5) * .25,
  a: Math.random() * 6.28, va: (Math.random() - .5) * .02, o: leaf ? .35 + Math.random() * .3 : .15 + Math.random() * .4 });
for (let i = 0; i < 70; i++) parts.push(mk(false));
for (let i = 0; i < 9; i++) parts.push(mk(true));
const cols = ["#b4501c", "#d9902f", "#8f2f1e", "#c77a22"];
function tick(t) {
  cx.clearRect(0, 0, W, H);
  parts.forEach((p, i) => {
    p.x += p.vx + Math.sin(t / 1800 + i) * .2; p.y += p.vy; p.a += p.va;
    if (p.y > H + 20) { p.y = -20; p.x = Math.random() * W; }
    if (p.y < -20) { p.y = H + 20; p.x = Math.random() * W; }
    if (p.x < -20) p.x = W + 20; if (p.x > W + 20) p.x = -20;
    cx.globalAlpha = p.o;
    if (p.leaf) {
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a); cx.scale(1, Math.abs(Math.cos(p.a * .7)) * .8 + .25);
      cx.fillStyle = cols[i % 4]; cx.beginPath(); cx.ellipse(0, 0, p.r * 1.7, p.r, 0, 0, 6.28); cx.fill(); cx.restore();
    } else { cx.fillStyle = "#ecdcb8"; cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 6.28); cx.fill(); }
  });
  if (!reduce) requestAnimationFrame(tick);
}
reduce ? tick(0) : requestAnimationFrame(tick);

// старт
dots[0].classList.add("on"); $("#prev").disabled = true;
</script>
